<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes | Bored of Toast</title>
  <meta name="description" content="Find recipes for every kind of day, from quick weeknight meals to slow weekend favorites.">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="recipes">
  <header id="site-header"></header>

  <section class="hero hero-short">
    <div class="hero-grid">
      <div class="hero-copy">
        <p class="eyebrow">Recipes</p>
        <h1>Explore, cook,<br><em>enjoy.</em></h1>
        <p>Find recipes for every kind of day, from quick weeknight meals to slow weekend favorites.</p>
        <img src="images/leaf.svg" alt="" class="leaf">
      </div>
      <div class="hero-media"><img src="images/grain-bowl.jpg" alt="Mediterranean grain bowl"></div>
    </div>
  </section>

  <main class="container section">
    <div class="toolbar">
      <div class="search">
        <input type="search" id="search" placeholder="Search recipes or ingredients…" aria-label="Search recipes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="recipe-grid wide" id="recipe-grid"></div>
    <p class="empty" id="empty">No recipes match your search. Try another ingredient.</p>
  </main>

  <footer id="site-footer"></footer>
  <script src="app.js"></script>
</body>
</html>
